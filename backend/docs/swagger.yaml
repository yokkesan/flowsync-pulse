basePath: /
definitions:
  auth.CurrentUserCompany:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  auth.CurrentUserCompanyMember:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  auth.CurrentUserResponse:
    properties:
      company:
        $ref: '#/definitions/auth.CurrentUserCompany'
      user:
        $ref: '#/definitions/auth.CurrentUserCompanyMember'
    type: object
  auth.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  auth.LoginCompany:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      company:
        $ref: '#/definitions/auth.LoginCompany'
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/auth.LoginUser'
    type: object
  auth.LoginUser:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  company.CreateRequest:
    properties:
      name:
        maxLength: 150
        minLength: 2
        type: string
      slug:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  company.CreateResponse:
    properties:
      company_id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  company.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  project.CreateRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      end_date:
        type: string
      member_ids:
        items:
          type: integer
        minItems: 1
        type: array
      name:
        maxLength: 150
        minLength: 2
        type: string
      slug:
        maxLength: 100
        minLength: 2
        type: string
      start_date:
        type: string
      status:
        enum:
        - planned
        - active
        - completed
        - archived
        type: string
    required:
    - member_ids
    - name
    - slug
    - status
    type: object
  project.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  project.ListResponse:
    properties:
      projects:
        items:
          $ref: '#/definitions/project.Response'
        type: array
    type: object
  project.MemberResponse:
    properties:
      display_name:
        type: string
      role:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  project.Response:
    properties:
      company_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      end_date:
        type: string
      members:
        items:
          $ref: '#/definitions/project.MemberResponse'
        type: array
      name:
        type: string
      project_id:
        type: integer
      slug:
        type: string
      start_date:
        type: string
      status:
        type: string
      task_count:
        type: integer
      updated_at:
        type: string
    type: object
  project.UpdateRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      end_date:
        type: string
      member_ids:
        items:
          type: integer
        minItems: 1
        type: array
      name:
        maxLength: 150
        minLength: 2
        type: string
      slug:
        maxLength: 100
        minLength: 2
        type: string
      start_date:
        type: string
      status:
        enum:
        - planned
        - active
        - completed
        - archived
        type: string
    required:
    - member_ids
    - name
    - slug
    - status
    type: object
  task.CreateRequest:
    properties:
      assignee_user_id:
        type: integer
      branch_name:
        maxLength: 255
        minLength: 1
        type: string
      description:
        maxLength: 5000
        type: string
      due_date:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      priority:
        enum:
        - high
        - medium
        - low
        type: string
      start_date:
        type: string
      status:
        enum:
        - not_started
        - in_progress
        - completed
        - suspended
        type: string
    required:
    - assignee_user_id
    - branch_name
    - name
    - priority
    - status
    type: object
  task.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  task.ListResponse:
    properties:
      tasks:
        items:
          $ref: '#/definitions/task.Response'
        type: array
    type: object
  task.Response:
    properties:
      assignee_name:
        type: string
      assignee_user_id:
        type: integer
      branch_name:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_date:
        type: string
      name:
        type: string
      priority:
        type: string
      project_id:
        type: integer
      start_date:
        type: string
      status:
        type: string
      task_id:
        type: integer
      updated_at:
        type: string
    type: object
  task.UpdateRequest:
    properties:
      assignee_user_id:
        type: integer
      branch_name:
        maxLength: 255
        minLength: 1
        type: string
      description:
        maxLength: 5000
        type: string
      due_date:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      priority:
        enum:
        - high
        - medium
        - low
        type: string
      start_date:
        type: string
      status:
        enum:
        - not_started
        - in_progress
        - completed
        - suspended
        type: string
    required:
    - assignee_user_id
    - branch_name
    - name
    - priority
    - status
    type: object
  user.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      display_name:
        maxLength: 100
        minLength: 2
        type: string
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      password_confirmation:
        type: string
    required:
    - display_name
    - email
    - password
    - password_confirmation
    type: object
  user.RegisterResponse:
    properties:
      company_id:
        type: integer
      display_name:
        type: string
      email:
        type: string
      role:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8081
info:
  contact: {}
  description: FlowSync Pulse バックエンドAPI仕様書
  title: FlowSync Pulse API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: メールアドレスとパスワードで認証し、アクセストークンとユーザー情報を返します。
      parameters:
      - description: ログイン情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: ログイン
      tags:
      - auth
  /api/companies:
    post:
      consumes:
      - application/json
      description: 会社名と会社スラッグを指定して、新しい会社を登録します。
      parameters:
      - description: 会社情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/company.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/company.CreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/company.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/company.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/company.ErrorResponse'
      summary: 会社登録
      tags:
      - companies
  /api/companies/{companyId}/users:
    post:
      consumes:
      - application/json
      description: 指定した会社に所属するユーザーを登録します。
      parameters:
      - description: 会社ID
        in: path
        name: companyId
        required: true
        type: integer
      - description: ユーザー情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: ユーザー登録
      tags:
      - users
  /api/health:
    get:
      description: APIサーバーとデータベースの接続状態を返します。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: ヘルスチェック
      tags:
      - health
  /api/me:
    get:
      description: アクセストークンから現在のログインユーザーと会社情報を取得します。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ログインユーザー取得
      tags:
      - auth
  /api/projects:
    get:
      description: ログインユーザーが所属しているプロジェクト一覧を取得します。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.ListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロジェクト一覧取得
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: ログインユーザーの会社に新しいプロジェクトを登録します。
      parameters:
      - description: プロジェクト情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロジェクト登録
      tags:
      - projects
  /api/projects/{projectId}:
    delete:
      description: ログインユーザーが所属しているプロジェクトを削除します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロジェクト削除
      tags:
      - projects
    get:
      description: ログインユーザーが所属しているプロジェクトの詳細を取得します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロジェクト詳細取得
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: ログインユーザーが所属しているプロジェクトを編集します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      - description: プロジェクト編集情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/project.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/project.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロジェクト編集
      tags:
      - projects
  /api/projects/{projectId}/tasks:
    get:
      description: 対象プロジェクトに登録されているタスク一覧を取得します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: プロジェクトのタスク一覧取得
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: 対象プロジェクトに新しいタスクとブランチ情報を登録します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      - description: タスク情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: タスク登録
      tags:
      - tasks
  /api/projects/{projectId}/tasks/{taskId}:
    delete:
      description: 対象プロジェクトに登録されているタスクを削除します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      - description: タスクID
        in: path
        name: taskId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: タスク削除
      tags:
      - tasks
    get:
      description: 対象プロジェクトに登録されているタスク詳細を取得します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      - description: タスクID
        in: path
        name: taskId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: タスク詳細取得
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: 対象プロジェクトに登録されているタスク情報とブランチ情報を編集します。
      parameters:
      - description: プロジェクトID
        in: path
        name: projectId
        required: true
        type: integer
      - description: タスクID
        in: path
        name: taskId
        required: true
        type: integer
      - description: タスク編集情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/task.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/task.ErrorResponse'
      security:
      - BearerAuth: []
      summary: タスク編集
      tags:
      - tasks
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
